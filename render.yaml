# Render blueprint — one free web service in the EU, Docker runtime.
#
# The database is NOT declared here: it is a Neon project in Europe/Frankfurt,
# created outside Render and supplied as DATABASE_URL. Render's own Postgres has
# no permanently-free plan, so declaring it here would break the €0/month budget.
#
# Migrations run before traffic is accepted, but NOT via `preDeployCommand`:
# that is a paid-instance feature. docker-entrypoint.sh applies them and only
# then execs the server, so a failed migration exits non-zero, the health check
# never passes, the deploy is marked failed and the previous version keeps
# serving. Move to preDeployCommand if this service ever moves to a paid plan.

services:
  - type: web
    name: astro-report
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      # Set manually from the Neon connection string (Europe/Frankfurt project).
      # `sync: false` keeps the secret out of the repository.
      - key: DATABASE_URL
        sync: false
      # PORT is injected by Render itself and is deliberately not declared here:
      # setting it would fight the value the platform assigns. It is one of the
      # required variables — see .env.example for the full set.
      # Set manually to an Argon2 hash of Francesco's real sign-in password
      # (Story 1.4). `sync: false` keeps it out of the repository, same as
      # DATABASE_URL above. Generate with:
      #   uv run python -c "import argon2; print(argon2.PasswordHasher().hash('...'))"
      - key: AUTH_PASSWORD_HASH
        sync: false
      # Set manually to a random string of at least 32 characters that signs
      # the session cookie. `sync: false` for the same reason. Generate with:
      #   uv run python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: SESSION_SECRET_KEY
        sync: false
      # Set manually to the Gemini API key for the configured Generator
      # adapter (Story 4.5, AD-9). `sync: false` for the same reason.
      - key: GEMINI_API_KEY
        sync: false
      # Set manually to the ISO date (YYYY-MM-DD) Gemini's data terms were
      # verified (NFR-17) -- recorded, not just checked once, because the
      # zero-cost guarantee is jurisdiction-contingent. `sync: false` is not
      # needed for secrecy here, but keeps every required Setting in this
      # block consistent -- this is still a manual, deliberate value, never
      # a default.
      - key: GEMINI_DATA_TERMS_VERIFIED_AT
        sync: false

[project]
name = "astro-report"
version = "0.1.0"
description = "Natal charts, monthly transits and grounded Italian reports for a single operator."
requires-python = "==3.13.*"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "psycopg[binary]>=3.2.0",
    "pyswisseph==2.10.3.2",
    "sqlmodel==0.0.39",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
# Tooling and planning artifacts, not application source.
extend-exclude = ["_bmad", "_bmad-output", ".bmad", ".claude", ".tokensave"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

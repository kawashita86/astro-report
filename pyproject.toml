[project]
name = "astro-report"
version = "0.1.0"
description = "Natal charts, monthly transits and grounded Italian reports for a single operator."
requires-python = "==3.13.*"
dependencies = [
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "geopy==2.5.0",
    "jinja2==3.1.6",
    "kerykeion==5.12.9",
    "psycopg[binary]>=3.2.0",
    "pyswisseph==2.10.3.2",
    "sqlmodel==0.0.39",
    "timezonefinder==8.2.5",
    "uuid6==2025.0.1",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# An xfail that starts passing (e.g. a conformance fixture starting to match
# once Epic 2/3 wires in real computation) must fail the build loudly, not
# pass silently -- that XPASS is the signal to remove the xfail marker.
xfail_strict = true

[tool.ruff]
target-version = "py313"
line-length = 100
# Tooling and planning artifacts, not application source.
extend-exclude = ["_bmad", "_bmad-output", ".bmad", ".claude", ".tokensave"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is FastAPI's own dependency-injection
# idiom (Story 2.3's `shell/http/routes/clients.py`), not the mutable-default
# footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends"]

# Runs on every push to main and every pull request, so conformance is not an
# on-demand check (Story 1.6, AC4) -- and, as a side effect, so the whole
# existing test suite finally runs automatically at all (deferred-work.md,
# story 1.1 entry): render.yaml auto-deploys every commit to main regardless
# of whether anyone happened to run pytest by hand first.
#
# Deliberately not wired as a required check blocking that auto-deploy --
# that is a separate decision (branch protection plus a Render-side
# integration), logged in deferred-work.md (story 1.6 entry) rather than
# defaulted into as a side effect of adding CI.
#
# A Postgres service container backs tests/test_migration_chain_on_postgres.py:
# `alembic upgrade head` had never actually run against Postgres from a clean
# database (offline `--sql` emission executes nothing; SQLite ignores
# VARCHAR(n)), which let a revision id longer than alembic_version.version_num
# ship green for three epics. That test resets the service DB's public schema
# and runs the real online upgrade against it. MIGRATION_TEST_DATABASE_URL
# points at it here; unset elsewhere, the test skips.
#
# No extra `apt-get install` step: GitHub's `ubuntu-latest` runner image
# ships `build-essential` by default, unlike the bare `ubuntu:latest` Docker
# base the Dockerfile installs it onto explicitly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same image tag as compose.yaml's local Postgres. A throwaway database:
    # tests/test_migration_chain_on_postgres.py drops and recreates its schema.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrationtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migrationtest"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Same pinned version, installed the same way, as Dockerfile:19.
      - name: Install uv
        run: pip install --no-cache-dir uv==0.10.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrationtest

  # Production deploy (Coolify on the Netcup VPS). Runs only on pushes to main
  # and only after `test` passed, so a red build never reaches production --
  # the gap noted at the top of this file for the Render auto-deploy. Coolify's
  # own auto-deploy is turned OFF for this application; this call is the only
  # trigger. Migrations still run in docker-entrypoint.sh, and a failed health
  # check leaves the previous container serving.
  #
  # Needs two repository secrets (Settings -> Secrets and variables -> Actions):
  #   COOLIFY_DEPLOY_WEBHOOK  the application's "Deploy Webhook" URL from Coolify
  #   COOLIFY_API_TOKEN       a Coolify API token with the "deploy" permission
  # Until both exist the job is skipped with a notice rather than failing.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger the Coolify deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::notice::Coolify secrets not configured; skipping the production deploy."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_DEPLOY_WEBHOOK}"

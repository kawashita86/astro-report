[metadata]
name = "composite-midpoint-houses"
adversarial_case = "composite house method: which of midpoint_cusps / derived_from_mc Astro.com uses"
source = "Astro.com composite chart, Midpoint method (btyp=621), Placidus, of the profiles 'Case1 LeapDay' and 'Case3 Midnight', Francesco's Astro.com session 2026-10-10. Values transcribed in degrees-minutes-seconds and converted to decimal degrees here."
finding = "Every cusp and the ascendant equals the shorter-arc midpoint of the two natal cusps within 0.0008 degrees; the MC-derived variant misses by 2-7 degrees (cusps 11/12, 2/3, ascendant). Hence [composite] houses = midpoint_cusps."
tolerance_degrees = "0.002"

[birth_data]
composite_of = ["leap-day-birth", "near-midnight-birth"]


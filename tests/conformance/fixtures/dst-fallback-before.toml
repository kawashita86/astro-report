[metadata]
name = "dst-fallback-before"
adversarial_case = "birth minutes before a historical DST 'fall back' switch — the first (EDT) occurrence of an ambiguous repeated local hour"
source = "Real, widely-reported case: twin brothers born at Cape Cod Hospital, Barnstable/Hyannis, MA on 2016-11-06, the night clocks fell back at 2:00am local. This is the elder-born twin, recorded before the clock changed (EDT, UTC-4). His brother, born ~31 minutes later but after the clock fell back, is the companion fixture 'dst-fallback-after.toml' — same event, same location, testing the ambiguous repeated 1am-1:59am hour from both sides. Positions/houses/aspects computed by astro.com's free chart tool (Placidus, Web default style), timezone explicitly forced to EDT (w04:00 AST/EDT) rather than left on 'automatic', since astro.com itself flags this hour as ambiguous. Logged in against an Astro.com account on 2026-08-15."
note = "Astro.com profile label 'Case2 Samuel DST' used in place of the real name. Real news coverage: NBC Boston/NBC 7 San Diego, ABC News, 'Twins' Daylight Saving Time Birth Results in Bizarre Age Twist'."

[birth_data]
date = "2016-11-06"
time = "01:39:00"
timezone = "America/New_York"
utc_offset_hours = "-4"
dst_in_effect = true
latitude = "41.65"
longitude = "-70.2833"
place = "Hyannis, MA, US"


house_departed = 3
house_entered = 4
bracket_start_date = "2022-12-09"
bracket_end_date = "2022-12-10"
source_2026_08_19 = "Bracketed directly from astro.com's own 'Natal chart and transits' tool against the near-midnight-birth.toml anchor chart (Case3 Midnight), the same method used for the Mercury station bracket above: transiting Mercury sits at 3 Capricorn 5' (273.0833 degrees) on 2022-12-09 00:00 UT, still short of house 4's cusp (273.2667 degrees, this fixture's own anchor chart), and has advanced to 4 Capricorn 33' (274.55 degrees) by 2022-12-10 00:00 UT, already past it -- the crossing itself falls inside that one-day window. Logged in against an Astro.com account on 2026-08-19."

[[expected.stations]]
body = "mercury"
motion = "retrograde"
bracket_start_date = "2022-12-28"
bracket_start_longitude = "294.1833"
bracket_start_retrograde = false
bracket_end_date = "2022-12-31"
bracket_end_longitude = "294.1167"
bracket_end_retrograde = true
correction_2026_08_19 = "bracket_start_longitude/bracket_end_longitude were each transcribed one zodiac sign short (264.1833 -> 294.1833, 264.1167 -> 294.1167), the same transcription bug already documented and corrected for mars/jupiter's transit_positions in this fixture (correction_2026_08_18 above): Story 3.2's real find_stations() computation independently locates Mercury's actual Dec 2022 station at 294.3567 degrees (24 Capricorn), and the same low-level position math confirms 294.1797 degrees on 2022-12-28 00:00 UTC (still direct) and 294.1108 degrees on 2022-12-31 00:00 UTC (already retrograde) -- both in Capricorn, not Sagittarius. bracket_start_date/bracket_end_date and bracket_start_retrograde/bracket_end_retrograde were already correct; only the longitude values needed the same +30-degree sign correction."
reverify_2026_08_20 = "Re-verified against a live Astro.com session (epic-3-retro-item-21, escalated from epic-2-retro-item-15 -- this correction also used only Story 3.2's own new computation as its reference): a one-off event chart for Greenwich at each bracket instant shows mercury at 24 Cap 10'47\" direct (294.1797 degrees) on 2022-12-28 00:00 UT, and 24 Cap 06'39\" retrograde (294.1108 degrees) on 2022-12-31 00:00 UT -- both in Capricorn, matching the corrected bracket_start_longitude/bracket_end_longitude and their retrograde flags to within the project's usual noise band. No further correction needed."


[metadata]
name = "no-lunations-month"
adversarial_case = "a calendar month containing zero full moons of a kind (February is the only month short enough for this to happen)"
source = "February 2018 had no full moon at all: the preceding full moon fell on 2018-01-31 and the next on 2018-03-01/02, so both January and March 2018 had two full moons each while February had none -- corroborated independently across king5.com, inforum.com, and Old Farmer's Almanac (astro-phile.com / almanac.com). This is the most recent such February before this fixture was written (the last prior instance was 2018 per almanac.com's tracking; the next isn't until 2037). Transit snapshot (all bodies except the Moon) computed via astro.com's 'Natal chart and transits' tool at 2018-02-01 00:00 UT against the near-midnight-birth.toml natal chart as anchor. Logged in against an Astro.com account on 2026-08-15."
note = "expected.lunations carries zero full_moon entries -- that absence IS the adversarial fact under test (a computation that always finds at least one full moon per month would wrongly report one here). It does carry one new_moon entry (see correction_2026_08_19): the adversarial claim under test was always about full moons specifically, not about the month having no Lunations at all. The transit snapshot is a single moment (month start, 00:00 UT), not a whole-month walk."
correction_2026_08_18 = "mercury's transit_positions longitude was transcribed one zodiac sign ahead (330.6833 Pisces -> 300.6871 Aquarius), and jupiter's retrograde flag was a false positive (Jupiter's real 2018 retrograde ran March 8 - July 10; on 2018-02-01 it was still direct, decelerating toward that station): Story 3.1's real find_transit_aspects() computation caught both, the other eight bodies' longitudes already matching within the runner's existing noise band. expected.transit_events[1] (mercury's own transiting-to-natal match) is corrected accordingly -- from a self-consistent-but-wrong 'mercury sextile natal mercury' (only true under the mistranscribed position) to the real 'mercury sextile natal neptune' -- every other transit_events entry reproduces unchanged from the same derivation method against the seven already-correct positions."
reverify_2026_08_20 = "Re-verified against a live Astro.com session (epic-3-retro-item-21, escalated from epic-2-retro-item-15 -- this fixture's correction used only Story 3.1's own new computation as its reference, the exact self-validation pattern that item flagged): the 'Natal chart and transits' tool for 2018-02-01 00:00 UT against the Case3 Midnight anchor shows mercury at 0 Aqu 41' (300.6871 degrees exactly) and jupiter at 21 Sco 15' with no 'r' marker (direct, 231.2500 degrees) -- both match the corrected values, not the original mistranscription. No further correction needed."
correction_2026_08_19 = "expected.lunations was deliberately an empty list, but that only ever accounted for this file's own adversarial claim (zero *full* moons in February 2018) -- February 2018 also had a real new moon, on 2018-02-15 at 21:05 UTC, independently corroborated by astropixels.com's canonical Six Millennium Catalog of Phases of the Moon and lunaf.com, omitted from the original transcription. Added below; Story 3.4's real find_lunations() computation reproduces it exactly."
correction_2026_08_27 = "moon's transit_positions longitude was transcribed as 198.1833, which Story 8.1's real transit-position computation (_calc_body at this fixture's 2018-02-01 00:00 UT snapshot instant) contradicts: it puts the Moon at 138.1793 deg -- roughly 18 deg 11' Leo, consistent with the day after the 2018-01-31 total lunar eclipse (which was in Leo). Set to 138.1793 to match the computed value; the other nine bodies' longitudes and all retrograde flags reproduce unchanged within the runner's 0.01 deg tolerance. Blast radius is contained: the transiting Moon is excluded from FR-9 aspect scanning and lunations are located month-wide (not off this snapshot), so expected.transit_events and the 'no full moon in February 2018' claim this fixture exists to test are both unaffected by the 60 deg shift."
reverify_2026_08_27 = "Re-verified against a live Astro.com session (logged-in): the 'Natal chart and transits' tool for the Case3 Midnight anchor, Date 1 Feb. 2018, UT 0:00:00, shows the transiting Moon at 18 Leo 11' -- i.e. 138.183 deg, 0.004 deg from the computed 138.1793 and well inside the runner's 0.01 deg tolerance (Astro.com's own arcminute display precision is ~0.0167 deg). This also settles the root cause as a two-sign transcription offset, not a wrong-date read: the erroneous 198.1833 is 18 deg 11' Libra -- identical arcminutes, sign exactly two positions (+60 deg) off. A wrong-date read would not have preserved the 11'. Sun (12 Aqu 04' = 312.067) and Mercury (0 Aqu 41' = 300.683) in the same transit table also match their unchanged fixture values. No further correction needed."


[metadata]
name = "no-lunations-month"
adversarial_case = "a calendar month containing zero full moons of a kind (February is the only month short enough for this to happen)"
source = "February 2018 had no full moon at all: the preceding full moon fell on 2018-01-31 and the next on 2018-03-01/02, so both January and March 2018 had two full moons each while February had none -- corroborated independently across king5.com, inforum.com, and Old Farmer's Almanac (astro-phile.com / almanac.com). This is the most recent such February before this fixture was written (the last prior instance was 2018 per almanac.com's tracking; the next isn't until 2037). Transit snapshot (all bodies except the Moon) computed via astro.com's 'Natal chart and transits' tool at 2018-02-01 00:00 UT against the near-midnight-birth.toml natal chart as anchor. Logged in against an Astro.com account on 2026-08-15."
note = "expected.lunations is deliberately an empty list -- that emptiness IS the adversarial fact under test (a computation that always finds at least one full moon per month would wrongly report a nonempty list here). The transit snapshot is a single moment (month start, 00:00 UT), not a whole-month walk."

[birth_data]
anchor_natal_fixture = "near-midnight-birth"
month = "2018-02"
transit_snapshot_utc = "2018-02-01T00:00:00Z"

[expected]
lunations = []

[[expected.transit_positions]]
name = "sun"
longitude = "312.0667"

[[expected.transit_positions]]

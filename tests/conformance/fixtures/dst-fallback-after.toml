[metadata]
name = "dst-fallback-after"
adversarial_case = "birth minutes after a historical DST 'fall back' switch — the second (EST) occurrence of an ambiguous repeated local hour, chronologically later than a sibling whose displayed clock time is later"
source = "Real, widely-reported case: twin brothers born at Cape Cod Hospital, Barnstable/Hyannis, MA on 2016-11-06, the night clocks fell back at 2:00am local. This is the younger-born twin (born ~31 minutes after his brother, real time), but because the clock fell back between the two births, his recorded local time (1:10am EST) is numerically earlier than his brother's (1:39am EDT) -- companion fixture 'dst-fallback-before.toml'. A naive datetime comparison that ignores the UTC-offset change would conclude this twin was born first. Positions/houses/aspects computed by astro.com's free chart tool (Placidus, Web default style), timezone explicitly forced to EST (w05:00 EST/CDT) rather than left on 'automatic'. Logged in against an Astro.com account on 2026-08-15."
note = "Astro.com profile label 'Case2 Ronan DST' used in place of the real name. Astro.com's place-name autocomplete resolved to 'Hyannis Port, MA' rather than plain 'Hyannis' (a few km apart, same town of Barnstable) -- coordinates differ slightly from the sibling fixture as a result; this does not affect the DST-ambiguity behavior under test. Real news coverage: NBC Boston/NBC 7 San Diego, ABC News, 'Twins' Daylight Saving Time Birth Results in Bizarre Age Twist'."

[birth_data]
date = "2016-11-06"
time = "01:10:00"
timezone = "America/New_York"
utc_offset_hours = "-5"
dst_in_effect = false
latitude = "41.6333"
longitude = "-70.3"
place = "Hyannis Port, MA, US"


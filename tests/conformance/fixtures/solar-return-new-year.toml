[metadata]
name = "solar-return-new-year"
adversarial_case = "solar return of a 1 January birth falls on 1 January of the next year at 11:50 UTC, the year boundary"
source = "Astro.com 'Solar Return chart' (btyp=32, Placidus, tropical), profile 'Case3 Midnight', year 2027, Francesco's Astro.com session 2026-10-10."
tolerance_degrees = "0.005"
cusp_tolerance_degrees = "0.009"
instant_tolerance_seconds = "2"
note = "Astro.com rounds the return instant to whole seconds and prints cusps 2, 3, 11 and 12 to the minute only (hence cusp_tolerance_degrees); planets agree to 1 arc-second, angles within 0.004 degrees. Mean Node, Chiron and Lilith are not transcribed."


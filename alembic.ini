# Alembic configuration.
#
# The database URL is deliberately absent: it is supplied by
# migrations/env.py from shell/config.py, the one reader of the environment.
# Migrations are forward-only — every downgrade() raises (see script.py.mako).

[alembic]
script_location = migrations
prepend_sys_path = .
# Revisions are named <rev>_<slug>, matching 0001_baseline, rather than being
# given bare hash filenames. `%%` escapes the ConfigParser interpolation.
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

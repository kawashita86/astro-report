{% extends "base.html" %}
{% block title %}Edit Style Guide — astro-report{% endblock %}
{% block content %}
      <h1>Edit Style Guide</h1>
      {% if error %}
      <p role="alert">{{ error }}</p>
      {% endif %}
      <p>Saving creates a new version -- the current version is kept, never overwritten.</p>
      <form method="post" action="/style-guide/edit">
        <label for="content">Content</label>
        <textarea id="content" name="content" required rows="30" cols="100">{{ content }}</textarea>

        <button type="submit">Save new version</button>
      </form>
{% endblock %}

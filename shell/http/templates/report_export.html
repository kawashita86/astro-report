<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Report — {{ client_name }}</title>
  </head>
  <body>
    <main>
      <h1>{{ client_name }}</h1>

      {% for section_name in section_order %}
      <section>
        <h2>{{ section_name }}</h2>
        {% if section_name in list_section_names %}
        <ul>
          {% for item in draft[section_name] %}
          <li>{{ item.date }} — {{ item.text or "" }}</li>
          {% endfor %}
        </ul>
        {% else %}
        <p>{{ draft[section_name].text }}</p>
        {% endif %}
      </section>
      {% endfor %}
    </main>
  </body>
</html>

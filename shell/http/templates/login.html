{% extends "base.html" %}
{% block title %}Sign in — astro-report{% endblock %}
{% block sidebar %}{% endblock %}
{% block app_header %}{% endblock %}
{% block main_class %}auth-view{% endblock %}
{% block content %}
      <h1>Sign in</h1>
      {% if error %}
      <p role="alert">Incorrect password.</p>
      {% endif %}
      <form method="post" action="/login">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          autofocus
        />
        <button type="submit">Sign in</button>
      </form>
{% endblock %}

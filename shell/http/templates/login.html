{% extends "base.html" %}
{% block title %}Accedi — astro-report{% endblock %}
{% block sidebar %}{% endblock %}
{% block app_header %}{% endblock %}
{% block main_class %}auth-view{% endblock %}
{% block content %}
      <h1>Accedi</h1>
      {% if error %}
      <p role="alert">Password errata.</p>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next | default('/') }}" />
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          autofocus
        />
        <button type="submit">Accedi</button>
      </form>
{% endblock %}
